plugins {
    id 'com.android.application'
}

android {
    namespace = "org.libsdl.helloworld"
    compileSdk = 35

    defaultConfig {
        applicationId = 'org.libsdl.SDL_Helloworld'
        // SDL needs 21, but zig's std.Io calls preadv64/pwritev64, introduced in bionic at 24
        minSdk = 24
        targetSdk = 35
        versionCode = 1
        versionName = '1.0'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none', '-DANDROID_PLATFORM=android-24', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                abiFilters 'arm64-v8a'
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path = 'src/main/c/CMakeLists.txt'
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    // SDL's Java side (org.libsdl.app), installed by `zig build lib` from the same SDL source
    // the native libSDL3.a is built from.
    sourceSets {
        main {
            java.srcDirs += '../../zig-project/zig-out/java'
        }
    }
}

// Runs `zig build lib` (libsdl_hello.a, libSDL3.a, SDL Java sources) before every build.
// Optional local.properties entry: zig.path=/abs/path/to/zig (Android Studio may not see your shell PATH).
def ndkDir = androidComponents.sdkComponents.ndkDirectory
tasks.register('zigBuild', Exec) {
    def props = new Properties()
    rootProject.file('local.properties').withInputStream { props.load(it) }
    def host = System.getProperty('os.name').toLowerCase().with {
        it.contains('mac') ? 'darwin-x86_64' : it.contains('win') ? 'windows-x86_64' : 'linux-x86_64'
    }
    workingDir = file('../../zig-project')
    doFirst {
        commandLine props.getProperty('zig.path', 'zig'), 'build', 'lib',
                '-Dtarget=aarch64-linux-android',
                '-Doptimize=ReleaseSafe',
                "-Dandroid_include_path=${ndkDir.get()}/toolchains/llvm/prebuilt/${host}/sysroot/usr/include"
    }
}
preBuild.dependsOn 'zigBuild'
